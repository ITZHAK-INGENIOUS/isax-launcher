name: Build Isax APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"             "ndk;26.1.10909125" "cmake;3.22.1"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Isax-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Isax-debug-apk
          path: dist/Isax-debug.apk
          if-no-files-found: error
          retention-days: 14
